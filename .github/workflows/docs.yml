name: API docs

# Builds the documentation site with Sphinx and publishes it to GitHub Pages:
#   docs/*.md   the hand-written guides, read as markdown so they stay
#               readable on GitHub as well
#   docs/api.md the reference, generated by autodoc from the package's own
#               docstrings
# The package is installed rather than mocked: a reference built against mocks
# documents the mocks on the day an import breaks.

on:
  push:
    branches: [ master ]
    paths:
      - 'mx_remote/**'
      - 'docs/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least-privilege token that can still deploy Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; let a newer push cancel an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mx_remote and the docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install -r docs/requirements.txt

      - name: Run Sphinx
        # -W: a warning here is a docstring that renders wrong or a link that
        # 404s on the site, and neither is worth publishing.
        run: sphinx-build -b html -W --keep-going docs site

      - name: Reject unrendered directives
        # Autodoc emits reStructuredText. A directive written outside an
        # eval-rst block is passed through as prose, and Sphinx reports nothing
        # wrong - the whole reference renders as its own source and the build
        # still succeeds. This is what notices.
        run: |
          if grep -rlE '\.\. (py:|auto)[a-z]+::' site/*.html; then
            echo "::error::a directive rendered as text; wrap it in an eval-rst block"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
