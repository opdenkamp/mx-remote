[build-system]
requires = ["hatchling", "mypy<2"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[project]
name = "mx_remote"
dynamic = ["version"]
dependencies = [
  "aiohttp>=3.10.5",
  "aiofiles>=24.1.0",
  "netifaces>=0.11.0",
  # typing.override, from 3.12 on; mx_remote.compat picks the right one.
  "typing_extensions>=4.4; python_version < '3.12'",
]
requires-python = ">=3.11"
authors = [
  {name = "Lars Op den Kamp", email = "lars@opdenkamp-it.nl"},
]
maintainers = [
  {name = "Lars Op den Kamp", email = "lars@opdenkamp-it.nl"},
]
description = "Python 3 library for interfacing with MX Remote compatible devices"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["matrixos", "oneip", "ampos", "pulse-eight"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Topic :: System :: Networking :: Monitoring",
]

[tool.hatch.build.targets.sdist]
# Allowlist, not an ignore list: the working tree also holds an unrelated git
# repository and machine-local tool config, and a default sdist sweeps in every
# file that is merely not gitignored.
include = [
  "/mx_remote",
  "/tests",
  "/hatch_build.py",
  "/README.md",
  "/docs",
  "/LICENSE",
  "/AGENTS.md",
  "/CLAUDE.md",
]

[tool.hatch.version]
source = "regex"
path = "mx_remote/const.py"
pattern = "VERSION = '(?P<version>[^']+)'"

[project.urls]
Homepage = "https://github.com/opdenkamp/mx-remote/"
Documentation = "https://opdenkamp.github.io/mx-remote/"
Repository = "https://github.com/opdenkamp/mx-remote.git"
"Bug Tracker" = "https://github.com/opdenkamp/mx-remote/issues"

[project.scripts]
mxr = "mx_remote.main:mxr_main"
